<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SATPrep</title>
<meta name="description" content="Free SAT &amp; PSAT Reading and Writing practice — 3,689 real questions with explanations.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="topbar-left" id="tab-title">Practice</div>
    <div class="topbar-actions" id="topbar-actions"></div>
  </header>

  <main id="view-root"></main>

  <nav class="tabbar">
    <button class="tab-btn active" data-tab="practice">
      <span class="tab-icon">✏️</span><span>Practice</span>
    </button>
    <button class="tab-btn" data-tab="review">
      <span class="tab-icon">🔁</span><span>Review</span>
    </button>
    <button class="tab-btn" data-tab="stats">
      <span class="tab-icon">📊</span><span>Stats</span>
    </button>
  </nav>

</div>

<div id="modal-root"></div>

<script src="js/app.js"></script>
</body>
</html>
